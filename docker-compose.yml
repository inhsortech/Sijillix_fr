services:
  frontend:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:?Set VITE_API_URL before building}
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s